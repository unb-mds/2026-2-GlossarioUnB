name: SonarQube

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sonar:
    name: Qualidade (SonarQube Cloud)
    runs-on: ubuntu-latest
    # PR vindo de fork não recebe o segredo; roda só em push ou em PR de branch deste repositório.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o Sonar usa o git blame para atribuir cada linha nova.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Instala as bibliotecas do robô só quando o package-lock.json existe (ADR 0010).
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      # Roda os testes e grava a cobertura em coverage/lcov.info, o arquivo que o Sonar lê.
      - run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/lcov.info
      # Sem o segredo SONAR_TOKEN o scan é pulado, para o check não ficar vermelho.
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
