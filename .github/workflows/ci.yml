name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e validação dos termos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Instala as bibliotecas do robô de coleta (ADR 0010); o front não usa nenhuma.
      - run: npm ci
      # Roda os testes de domínio e valida todos os termos de frontend/data/termos.json (ADR 0004, ADR 0007).
      - run: npm test
      # Põe de propósito cada defeito de tests/sabotagens/ e confere que a suíte quebra (docs/TESTE-DE-SABOTAGEM.md).
      - run: npm run test:sabotagem
