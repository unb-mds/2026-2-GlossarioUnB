name: "✏️ Corrigir definição"
description: "Sugira uma correção ou atualização para um termo já cadastrado no Glossário"
title: "[Corrigir Definição] "
labels: ["contribuicao-externa", "dados"]
body:
  - type: markdown
    attributes:
      value: |
        **Encontrou algum erro ou informação desatualizada?** Preencha os campos abaixo e envie esta issue.
        Alguém do time valida a fonte e atualiza o Glossário UnB.

  - type: input
    id: termo
    attributes:
      label: Termo a ser corrigido
      description: Nome do termo, sigla ou expressão já cadastrado que precisa de ajuste.
      placeholder: 'Ex.: DEG, "menção SR", ICC, Ceubinho'
    validations:
      required: true

  - type: checkboxes
    id: campos
    attributes:
      label: O que precisa ser corrigido?
      description: Marque todos os campos afetados.
      options:
        - label: Significado da sigla
        - label: Definição do termo
        - label: Exemplo de uso
        - label: Tipo, categoria ou campus
        - label: Fonte desatualizada ou link quebrado
        - label: Localização no mapa
        - label: Correção ortográfica ou gramatical
        - label: Outro (explique no contexto adicional)

  - type: dropdown
    id: tipo
    attributes:
      label: Novo tipo (se precisar alterar)
      description: Preencha apenas se o tipo atual estiver errado.
      options:
        - sigla
        - giria
        - expressao
    validations:
      required: false

  - type: dropdown
    id: campus
    attributes:
      label: Novo campus (se precisar alterar)
      description: Preencha apenas se o campus atual estiver errado.
      options:
        - Geral
        - Darcy Ribeiro
        - Ceilândia
        - Gama
        - Planaltina
    validations:
      required: false

  - type: dropdown
    id: categoria
    attributes:
      label: Nova categoria (se precisar alterar)
      description: Preencha apenas se a categoria atual estiver errada.
      options:
        - vida-academica
        - unidades-academicas
        - administracao
        - colegiados
        - locais-campus
        - sistemas
        - assistencia-estudantil
        - representacao-estudantil
        - girias
    validations:
      required: false

  - type: textarea
    id: definicao
    attributes:
      label: Definição ou conteúdo sugerido
      description: Escreva como a definição ou informação corrigida deve ficar no Glossário.
      placeholder: "Descreva a correção sugerida com clareza."
    validations:
      required: true

  - type: input
    id: fonte
    attributes:
      label: Fonte da correção
      description: Link oficial da UnB (.unb.br), resolução, edital ou justificativa verificável.
      placeholder: "Ex.: https://www.unb.br/..."
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional (opcional)
      description: Alguma observação extra ou trecho atual que está incorreto?
    validations:
      required: false
