<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glossário UnB</title>
  <meta name="description" content="Consulte siglas, gírias e expressões da UnB.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <meta name="theme-color" content="#0f4c81">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <a href="index.html" class="link-cabecalho">
      <div class="cabecalho">
        <img class="logo" src="icons/icon-192.png" alt="">
        <h1 class="titulo">Glossário UnB</h1>
      </div>
    </a>
    <button id="botao-tema" class="botao-tema" type="button" aria-label="Alternar tema claro/escuro">🌙</button>
  </header>

  <main class="pesquisa">
    <form id="form-busca" class="pesquisa-form" role="search" autocomplete="off">
      <label for="campo-busca" class="sr-only">Pesquisar sigla, gíria ou expressão</label>
      <input id="campo-busca" type="text" placeholder="Pesquisar sigla..."
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugestoes">
      <button type="submit">Pesquisar</button>
      <ul id="sugestoes" class="sugestoes" role="listbox" aria-label="Sugestões de termos"></ul>
    </form>
    <p id="busca-status" class="sr-only" role="status"></p>
    <a class="link-todas-siglas" href="todas-siglas.html">Todas as siglas</a>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
