<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todas as Siglas — Glossário UnB</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <meta name="theme-color" content="#0f4c81">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <a href="index.html" class="link-cabecalho">
      <div class="cabecalho">
        <img class="logo" src="icons/icon-192.png" alt="">
        <p class="titulo">Glossário UnB</p>
      </div>
    </a>
    <button id="botao-tema" class="botao-tema" type="button" aria-label="Alternar tema claro/escuro">🌙</button>
  </header>

  <main>
    <h1 class="sr-only">Todas as siglas</h1>

    <div class="barra-filtro">
      <label for="filtro-campus">Campus:</label>
      <select id="filtro-campus">
        <option value="">Todos</option>
      </select>
      <label for="filtro-tipo">Tipo:</label>
      <select id="filtro-tipo">
        <option value="">Todos</option>
      </select>
    </div>
    <p id="filtro-status" class="sr-only" role="status"></p>

    <div id="lista-termos" class="lista-termos"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
