name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Desempenho e acessibilidade (Lighthouse CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Auditar páginas com Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Resumo dos relatórios no PR
        if: always()
        env:
          LINKS_JSON: ${{ steps.lighthouse.outputs.links }}
        run: |
          node -e '
            const fs = require("node:fs");
            const manifestPath = ".lighthouseci/manifest.json";
            if (!fs.existsSync(manifestPath)) process.exit(0);
            const entries = JSON.parse(fs.readFileSync(manifestPath, "utf8")).filter((e) => e.isRepresentativeRun);
            let links = {};
            try {
              links = JSON.parse(process.env.LINKS_JSON || "{}");
            } catch {
              links = {};
            }
            const fmt = (v) => (typeof v === "number" ? Math.round(v * 100) : "—");
            const lines = [
              "## Relatório do Lighthouse CI",
              "",
              "| Página | Performance | Acessibilidade | Boas práticas | Relatório |",
              "|---|---|---|---|---|",
            ];
            for (const entry of entries) {
              const s = entry.summary || {};
              const url = entry.url;
              const parsed = new URL(url);
              const page = parsed.pathname + parsed.search;
              const link = links[url] ? `[Abrir](${links[url]})` : "Artifact";
              lines.push(`| \`${page}\` | ${fmt(s.performance)} | ${fmt(s.accessibility)} | ${fmt(s["best-practices"])} | ${link} |`);
            }
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            }
          '
